# 파이프라인 설정. 비밀값은 여기 넣지 말고 환경변수/GitHub Secrets로 넣는다.
# 원칙: 유료 결제 수단은 쓰지 않는다 (API 종량 과금·유료 TTS·도메인 구입 없음).
#   CLAUDE_CODE_OAUTH_TOKEN : `claude setup-token` 으로 만든 Claude 구독 토큰 (API 키 아님, 종량 과금 없음)
#   DATA_GO_KR_KEY          : 공공데이터포털 "일반 인증키(Decoding)" (무료)

[site]
title = "실거래가 리포트"
tagline = "국토교통부 공개 데이터로 매일 갱신하는 서울 아파트 실거래 분석"
base_url = "https://silgeorae-report.github.io"   # 무료 GitHub Pages 주소 (Variables의 SITE_BASE_URL이 우선)
language = "ko"
author = "실거래가 리포트 편집팀"
contact_email = ""                 # 소개/개인정보 페이지에 노출 (애드센스 심사에 필요)
adsense_client = ""                # 예: "ca-pub-1234567890" — 승인 후 입력하면 광고 코드 자동 삽입
google_site_verification = ""      # 서치 콘솔 인증 메타태그 값
site_verification_files = ["google0ca3dda0f1e228c8.html"]  # 서치 콘솔/네이버 HTML 파일 인증 (삭제 금지)

[collect]
# 국토교통부 아파트 매매 실거래가 상세 자료
endpoint = "https://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev/getRTMSDataSvcAptTradeDev"
months_back = 3           # 매일 최근 N개월을 다시 수집 (신고기한 30일이라 지난달 데이터가 계속 늘어남)
backfill_months = 14      # 이 기간 중 DB에 없는 달은 자동 보충 — 지난달의 전년 동월 비교용(14개월 필요)
regions = "seoul"         # pipeline/regions.py 의 지역 묶음 이름

[generate]
model = "claude-opus-5-5"     # 구독 한도가 부족하면 claude-sonnet-5-5 로 낮춤
effort = "medium"
max_new_posts_per_run = 8     # 하루 생성/갱신 상한 (구독 한도·스팸 신호 제어)
min_trades_for_complex = 5    # 단지 페이지 생성 최소 거래 건수
regenerate_growth = 0.15      # 거래 건수가 이 비율 이상 늘면 글을 다시 작성(갱신)
llm_review = true             # 규칙 검사 통과 후 Claude 2차 검수 실행

[quality]
min_chars = 900               # 본문 최소 글자 수 (표 제외)
banned_phrases = ["무조건 오", "지금 사야", "반드시 오릅", "투자 추천", "매수 추천", "확실한 수익", "폭등 예정"]

[shorts]
enabled = true
max_per_run = 2               # 하루 생성할 숏폼 수
tts_provider = "auto"         # auto(edge → 실패 시 gtts) | edge | gtts | silent(시험용) — 모두 무료
voice = "ko-KR-SunHiNeural"   # edge 음성
max_seconds = 58
max_narration_chars = 90      # 장면당 내레이션 최대 글자 수(숫자 채운 뒤)
timelapse_monthly = true      # 매달 한 번 서울 25개 구 3D 타임랩스 숏폼 (pipeline/timelapse3d.py)
public_photos = true          # 위키미디어 공용의 허용 라이선스 사진을 배경으로 사용 (출처 자동 표기)

[youtube]
upload = true                 # YT_CLIENT_ID / YT_CLIENT_SECRET / YT_REFRESH_TOKEN 이 있을 때만 실제 업로드
privacy = "public"            # 2026-11-02부터 감사 없이도 공개 업로드 가능
category_id = "27"            # 27=교육 (22=인물/블로그, 25=뉴스/정치)

[instagram]
enabled = true                # IG_STATE_KEY + (IG_ACCESS_TOKEN 또는 data/ig_state.enc) 가 있을 때만 게시
max_per_run = 2               # 하루 게시할 릴스 수
days_back = 3                 # 최근 N일 안에 만든 영상만 게시 (영상 파일은 그날 Pages에만 올라감)

[safety]
enabled = true                # false 로 바꾸면 생성·발행 즉시 중단 (킬 스위치)
max_consecutive_failures = 3  # 연속 실패 시 그 실행에서 생성 중단
